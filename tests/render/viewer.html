<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Weapon render</title>
<style>html,body{margin:0;background:#120e18;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "/three/build/three.module.js" } }</script>
</head>
<body>
<script type="module">
import * as THREE from "three";

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

// Roblox WedgePart: right-triangle prism, YZ cross-section corners
// bottom-front (-h/2,-d/2), bottom-back (-h/2,+d/2), top-back (+h/2,+d/2).
function wedgeGeometry() {
  const v = [
    [-0.5,-0.5,-0.5],[-0.5,-0.5,0.5],[-0.5,0.5,0.5],
    [0.5,-0.5,-0.5],[0.5,-0.5,0.5],[0.5,0.5,0.5],
  ];
  const faces = [[0,2,1],[3,4,5],[0,1,4],[0,4,3],[1,2,5],[1,5,4],[0,3,5],[0,5,2]];
  const pos = [];
  for (const f of faces) for (const i of f) pos.push(...v[i]);
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return g;
}
const geoms = {
  Block: new THREE.BoxGeometry(1, 1, 1),
  Ball: new THREE.SphereGeometry(0.5, 24, 16),
  Cylinder: new THREE.CylinderGeometry(0.5, 0.5, 1, 24).rotateZ(-Math.PI / 2),
  Wedge: wedgeGeometry(),
};

function materialFor(p) {
  const color = new THREE.Color().setRGB(p.col[0], p.col[1], p.col[2], THREE.SRGBColorSpace);
  const params = { color, roughness: 0.55, metalness: 0.0, transparent: p.t > 0, opacity: 1 - p.t, side: THREE.DoubleSide };
  switch (p.m) {
    case "Metal": params.metalness = 0.45; params.roughness = 0.38; break;
    case "Neon": params.emissive = color; params.emissiveIntensity = 1.2; break;
    case "Fabric": params.roughness = 0.95; break;
    case "Slate": params.roughness = 0.9; break;
    case "Glass": params.transparent = true; params.opacity = 0.55; params.roughness = 0.1; break;
    case "SmoothPlastic": params.roughness = 0.42; break;
  }
  return new THREE.MeshStandardMaterial(params);
}

function buildScene(parts) {
  const group = new THREE.Group();
  for (const p of parts) {
    const geom = geoms[p.s] || geoms.Block;
    const mesh = new THREE.Mesh(geom, materialFor(p));
    let sx = p.sz[0], sy = p.sz[1], sz = p.sz[2];
    if (p.s === "Ball") { const d = Math.min(sx, sy, sz); sx = sy = sz = d; }
    if (p.s === "Cylinder") { const d = Math.min(sy, sz); sy = sz = d; }
    const c = p.cf;
    const m = new THREE.Matrix4().set(c[3], c[4], c[5], c[0], c[6], c[7], c[8], c[1], c[9], c[10], c[11], c[2], 0, 0, 0, 1);
    m.multiply(new THREE.Matrix4().makeScale(sx, sy, sz));
    mesh.matrixAutoUpdate = false;
    mesh.matrix.copy(m);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    group.add(mesh);
  }
  return group;
}

window.renderScene = function (data) {
  const w = data.width || 900, h = data.height || 700;
  renderer.setSize(w, h);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x2a2236);
  scene.fog = new THREE.Fog(0x2a2236, 60, 140);
  scene.add(new THREE.HemisphereLight(0xe8e0ff, 0x302838, 1.6));
  const key = new THREE.DirectionalLight(0xfff4e8, 2.8);
  key.position.set(-8, 14, -10);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.left = key.shadow.camera.bottom = -12;
  key.shadow.camera.right = key.shadow.camera.top = 12;
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xb070ff, 1.1);
  rim.position.set(10, 6, 12);
  scene.add(rim);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x241c2e, roughness: 0.95 }));
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = data.groundY ?? 0;
  ground.receiveShadow = true;
  if (data.ground !== false) scene.add(ground);
  const model = buildScene(data.parts);
  scene.add(model);
  const camera = new THREE.PerspectiveCamera(data.fov || 38, w / h, 0.1, 400);
  if (data.fit) {
    // Auto-frame the model's bounding box from the given direction.
    model.updateMatrixWorld(true);
    const box = new THREE.Box3();
    model.traverse((o) => { if (o.isMesh) { o.geometry.computeBoundingBox(); const b = o.geometry.boundingBox.clone().applyMatrix4(o.matrix); box.union(b); } });
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const radius = size.length() / 2;
    const dir = new THREE.Vector3(...data.fit).normalize();
    const dist = (radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2))) * (data.padding || 1.0);
    camera.position.copy(center).addScaledVector(dir, dist);
    camera.lookAt(center);
  } else {
    camera.position.set(...data.camera);
    camera.lookAt(new THREE.Vector3(...data.target));
  }
  renderer.render(scene, camera);
  return true;
};
window.viewerReady = true;
</script>
</body>
</html>
